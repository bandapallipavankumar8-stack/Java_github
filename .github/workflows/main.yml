name: Java CI/CD with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Change to '11' or '21' if your project uses a different version
          distribution: 'temurin'
          cache: 'maven' # Automatically caches ~/.m2 dependencies for faster builds

      - name: Build and run tests with Maven
        run: mvn -B test --file pom.xml

      - name: Package JAR file
        run: mvn -B package -DskipTests --file pom.xml

      - name: Upload built JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download built JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Deploy application
        run: |
          echo "Ready to deploy JAR file:"
          ls -lh target/*.jar
